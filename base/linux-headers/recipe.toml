[package]
name = "linux-headers"
version = "7.3.5"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://www.kernel.org/pub/linux/kernel/v7.x/linux-$VERSION.tar.xz", sha256 = "8f293f83d54f0b7b9be56863ebc5e4ea79d73e530b4ae55c572be97ef39f0990" },
]
patches = []

[build]
system = "raw"
steps = [
    "make -j$(nproc) mrproper",
    "make -j$(nproc) headers",
    "find usr/include -type f ! -name '*.h' -delete",
    "cp -rv usr/include \"$DESTDIR/usr/\"",
]

[install]
post = []
files = "auto"
backup = []
