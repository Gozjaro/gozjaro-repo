[package]
name = "linux"
version = "7.2.5"
release = 1
desc = "Linux kernel (bzImage + modules)"
license = "GPL-2.0-only"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://www.kernel.org/pub/linux/kernel/v7.x/linux-$VERSION.tar.xz", sha256 = "55ddf0df8325d9dad96fcff7bd93977d22e3f50af06527572af59b77c7632b78" },
]
patches = []

[build]
system = "raw"
steps = [
    "cp -f \"$RECIPE_DIR/configs/gozjaro.config\" ./.config",
    "make -j$(nproc) olddefconfig",
    "make -j$(nproc) -s",
    "install -d \"$DESTDIR/boot\"",
    "install -m644 arch/x86/boot/bzImage \"$DESTDIR/boot/vmlinuz-$VERSION\"",
    "install -m644 System.map \"$DESTDIR/boot/System.map-$VERSION\"",
    "install -m644 .config \"$DESTDIR/boot/config-$VERSION\"",
    "make -j$(nproc) -s modules_install INSTALL_MOD_PATH=\"$DESTDIR\" INSTALL_MOD_STRIP=1",
    "make -s firmware_install INSTALL_FW_PATH=\"$DESTDIR/lib/firmware\" || true",
    # modules_install / firmware_install both (re)create lib/modules/<ver>/build
    # pointing at the build scratch tree, which is not part of the installed
    # system — drop it last so nothing re-links it. External module builds
    # use linux-headers + the source tarball.
    "rm -f \"$DESTDIR/lib/modules/$VERSION/build\"",
]

[install]
post = []
files = "auto"
backup = []
