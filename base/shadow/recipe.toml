[package]
name = "shadow"
version = "4.20.3"
release = 1
depends = ["libxcrypt", "acl", "attr"]
build_depends = []

[source]
urls = [
    { url = "https://github.com/shadow-maint/shadow/releases/download/$VERSION/shadow-$VERSION.tar.xz", sha256 = "623be9429f64fa2165bfc5957c6a642ec309c5cf23c0d53855c99f7591922297" },
]
patches = []

[build]
system = "raw"
steps = [
    "sed -i 's/groups$(EXEEXT) //' src/Makefile.in",
    "find man -name Makefile.in -exec sed -i 's/groups\\.1 / /'   {} \\;",
    "find man -name Makefile.in -exec sed -i 's/getspnam\\.3 / /' {} \\;",
    "find man -name Makefile.in -exec sed -i 's/passwd\\.5 / /'   {} \\;",
    "sed -e 's:#ENCRYPT_METHOD SHA512:ENCRYPT_METHOD YESCRYPT:' \\",
    "    -e 's:/var/spool/mail:/var/mail:' \\",
    "    -i etc/login.defs",
    "mkdir -p \"$DESTDIR/usr/bin\" && touch \"$DESTDIR/usr/bin/passwd\"",
    "./configure --sysconfdir=/etc --disable-static --with-bcrypt --with-yescrypt \\",
    "    --without-libbsd --with-group-name-max-length=32",
    "make -j$(nproc)",
    "make -j$(nproc) exec_prefix=/usr DESTDIR=\"$DESTDIR\" install",
    "make -j$(nproc) -C man DESTDIR=\"$DESTDIR\" install-man",
]

[install]
post = []
files = "auto"
backup = []
