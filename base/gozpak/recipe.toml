[package]
name = "gozpak"
version = "6.0.0"
release = 1
desc = "GozJaro package manager (Rust; self-management meta package)"
license = "MIT"
depends = []
build_depends = ["rust"]

[source]
git = "git+https://github.com/Gozjaro/gozpak.git#98cbfa53d45dd59fb7cd6c7836aecb6c76a4920a"
patches = []

[build]
system = "raw"
steps = [
    "# cargo release build (glibc-dynamic binary)",
    "cd rs && cargo build --release --bin gozpak",
    "cd .. && install -Dm755 rs/target/release/gozpak \"$DESTDIR/usr/bin/gozpak\"",
    "install -Dm644 LICENSE \"$DESTDIR/usr/share/licenses/gozpak/LICENSE\"",
]

[install]
post = []
files = "auto"
backup = []

[meta]
type = "tool"
