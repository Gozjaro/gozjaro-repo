[package]
name = "m4"
version = "1.4.20"
release = 1
depends = []
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/m4/m4-$VERSION.tar.xz", sha256 = "e236ea3a1ccf5f6c270b1c4bb60726f371fa49459a8eaaebc90b216b328daf2b" },
]
patches = [
    "patches/m4-1.4.20-gcc16-c23-overloads.patch",
]

[build]
system = "raw"
steps = [
    "./configure --prefix=/usr CFLAGS=\"${CFLAGS:-} -std=gnu17\"",
    "make -j$(nproc)",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
