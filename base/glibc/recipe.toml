[package]
name = "glibc"
version = "2.44"
release = 1
depends = ["linux-headers"]
build_depends = []

[source]
urls = [
    { url = "https://mirrors.kernel.org/gnu/glibc/glibc-$VERSION.tar.xz", sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667" },
    { url = "https://www.linuxfromscratch.org/patches/lfs/13.1/glibc-fhs-1.patch", sha256 = "643552db030e2f2d7ffde4f558e0f5f83d3fabf34a2e0e56ebdb49750ac27b0d" },
    { url = "https://www.linuxfromscratch.org/patches/lfs/13.1/glibc-2.44-upstream_fixes-1.patch", sha256 = "500567ff0a22e295bfe3b55e9b397796f71a19f01e1ff7fb29c9189482ee1809" },
]
patches = []

[build]
system = "raw"
steps = [
    "patch -Np1 -i glibc-fhs-1.patch",
    "patch -Np1 -i glibc-2.44-upstream_fixes-1.patch",
    "mkdir -v build && cd build",
    "echo \"rootsbindir=/usr/sbin\" > configparms",
    "../configure --prefix=/usr \\",
    "    --disable-werror \\",
    "    --enable-kernel=4.19 \\",
    "    --enable-stack-protector=strong \\",
    "    --disable-nscd \\",
    "    libc_cv_slibdir=/usr/lib",
    "make -j$(nproc)",
    "mkdir -pv \"$DESTDIR/etc\"",
    "touch \"$DESTDIR/etc/ld.so.conf\"",
    "sed '/test-installation/s@$(PERL)@echo not running@' -i ../Makefile",
    "make -j$(nproc) DESTDIR=\"$DESTDIR\" install",
    "sed '/RTLDLIST=/s@/usr@@g' -i \"$DESTDIR/usr/bin/ldd\"",
    "mkdir -pv \"$DESTDIR/var/cache/nscd\"",
    "mkdir -pv \"$DESTDIR/etc/ld.so.conf.d\"",
    "cat > \"$DESTDIR/etc/ld.so.conf\" <<'CONF'",
    "/usr/local/lib",
    "/opt/lib",
    "include /etc/ld.so.conf.d/*.conf",
    "CONF",
]

[install]
post = []
files = "auto"
backup = []
