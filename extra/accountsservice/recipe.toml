[package]
name = "accountsservice"
version = "26.27.3"
release = 1
desc = "AccountsService (user account management over D-Bus)"
license = "LGPL-2.1-or-later"
depends = ["glib2", "json-glib"]
build_depends = ["meson", "ninja", "gobject-introspection"]

[source]
urls = [
    { url = "https://gitlab.freedesktop.org/accountsservice/accountsservice/-/archive/26.27.3/accountsservice-26.27.3.tar.gz" , sha256 = "11de07bcd499c2277f78a6fc830d1437654f3397cc7bbed19c28b3818435ba38"},
]
patches = []

[build]
system = "raw"
steps = [
    "meson setup \\",
    "build . \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--buildtype=release \\",
    "-Dtests=false",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\\\"$DESTDIR\\\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
