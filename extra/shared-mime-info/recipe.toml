[package]
name = "shared-mime-info"
version = "2.4"
release = 1
desc = "Freedesktop.org Shared MIME Info"
license = "GPL-2.0-or-later"
depends = ["glib2"]
build_depends = ["meson", "ninja", "glib2", "itstool", "xmlto"]

[source]
urls = [
    { url = "https://gitlab.freedesktop.org/xdg/shared-mime-info/-/archive/2.4/shared-mime-info-2.4.tar.gz", sha256 = "531291d0387eb94e16e775d7e73788d06d2b2fdd8cd2ac6b6b15287593b6a2de" },
]
patches = ["disable-spec-html.patch"]

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD shared-mime-info (build + package)",
    "# source top dir \"shared-mime-info-2.4\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dupdate-mimedb=true",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
