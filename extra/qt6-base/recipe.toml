[package]
name = "qt6-base"
version = "6.8.2"
release = 1
desc = "A cross-platform application and UI framework (Qt6)"
license = "GPL-3.0-or-later"
depends = ["glib2", "openssl", "libxkbcommon", "dbus", "libdrm", "mesa", "zlib", "sqlite"]
build_depends = ["cmake", "ninja", "python3", "wayland", "wayland-protocols", "libxkbcommon", "mesa", "libdrm", "openssl"]

[source]
urls = [
    { url = "https://download.qt.io/archive/qt/6.8/6.8.2/submodules/qtbase-everywhere-src-6.8.2.tar.xz" , sha256 = "012043ce6d411e6e8a91fdc4e05e6bedcfa10fcb1347d3c33908f7fdd10dfe05"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD qt6-base (build + package)",
    "# source top dir \"qtbase-everywhere-src-6.8.2\" is stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S \".\" \\",
    "-GNinja \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DINSTALL_BINDIR=lib/qt6/bin \\",
    "-DINSTALL_PUBLICBINDIR=usr/bin \\",
    "-DINSTALL_LIBEXECDIR=lib/qt6 \\",
    "-DINSTALL_DOCDIR=share/doc/qt6 \\",
    "-DINSTALL_ARCHDATADIR=lib/qt6 \\",
    "-DINSTALL_DATADIR=share/qt6 \\",
    "-DINSTALL_INCLUDEDIR=include/qt6 \\",
    "-DINSTALL_MKSPECSDIR=lib/qt6/mkspecs \\",
    "-DINSTALL_EXAMPLESDIR=share/doc/qt6/examples \\",
    "-DQT_FEATURE_wayland=ON \\",
    "-DQT_FEATURE_openssl=ON \\",
    "-DQT_FEATURE_openssl_linked=ON \\",
    "-DQT_FEATURE_system_sqlite=OFF \\",
    "-DQT_FEATURE_icu=OFF \\",
    "-DQT_FEATURE_gui=ON \\",
    "-DQT_FEATURE_widgets=ON \\",
    "-DQT_FEATURE_xcb=OFF \\",
    "-DQT_FEATURE_x11=OFF \\",
    "-DQT_BUILD_TESTS=OFF \\",
    "-DQT_BUILD_EXAMPLES=OFF",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
    "install -Dm644 \".LICENSES/LGPL-3.0-only.txt\" \\",
    "\"$DESTDIR/usr/share/licenses/qt6-base/LGPL-3.0\"",
]

[install]
post = []
files = "auto"
backup = []
