[package]
name = "gstreamer"
version = "1.24.12"
release = 1
desc = "GStreamer Multimedia Framework"
license = "LGPL-2.1-or-later"
depends = ["glib2"]
build_depends = ["meson", "ninja", "gobject-introspection"]

[source]
urls = [
    { url = "https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-1.24.12.tar.xz" , sha256 = "b3522d1b4fe174fff3b3c7f0603493e2367bd1c43f5804df15b634bd22b1036f"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD gstreamer (build + package)",
    "# source top dir \"gstreamer-1.24.12\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--buildtype=release \\",
    "-Dgst_debug=false \\",
    "-Dintrospection=enabled \\",
    "-Ddbghelp=disabled \\",
    "-Dtests=disabled \\",
    "-Dexamples=disabled \\",
    "-Dbenchmarks=disabled \\",
    "-Dtracer_hooks=false",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
