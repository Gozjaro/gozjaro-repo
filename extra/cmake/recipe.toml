[package]
name = "cmake"
version = "4.5.0"
release = 1
desc = "A cross-platform open-source make system"
license = "BSD-3-Clause"
depends = ["libarchive", "curl", "expat", "zlib"]
build_depends = []

[source]
urls = [
    { url = "https://www.cmake.org/files/v4.5/cmake-4.5.0.tar.gz" , sha256 = "424352d6133e8455e020da787008e8dc67abb18820af3532572ab35657e49213"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD cmake (build + package)",
    "# cmake 4.x: 3.31 cannot compile against curl 8.23 (CURL_NETRC_OPTION became a real enum)\n  # source top dir \"cmake-4.5.0\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "# LFS ncurses is wide-only (libformw, no libform): --system-libs forces",
    "# CMAKE_USE_SYSTEM_FORM=ON which FATALs in cmake 3.31 — use per-lib flags so",
    "# form defaults OFF and cmake compiles its bundled form lib",
    "",
    "./bootstrap \\",
    "--prefix=/usr \\",
    "--system-libarchive \\",
    "--system-curl \\",
    "--system-expat \\",
    "--system-zlib \\",
    "--no-system-jsoncpp \\",
    "--no-system-librhash \\",
    "--no-system-cppdap \\",
    "--mandir=/share/man \\",
    "--datadir=/share/cmake \\",
    "-- -DCMAKE_BUILD_TYPE=Release -DCMAKE_USE_SYSTEM_FORM=OFF",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
    "# cmake 4.x ships LICENSE.rst (Copyright.txt was removed)",
    "install -Dm644 LICENSE.rst \"$DESTDIR/usr/share/licenses/cmake/LICENSE\"",
]

[install]
post = []
files = "auto"
backup = []
