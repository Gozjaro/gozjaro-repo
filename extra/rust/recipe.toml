[package]
name = "rust"
version = "1.100.0"
release = 1
desc = "Systems programming language focused on safety and performance"
license = "MIT"
depends = []
build_depends = ["python3", "ninja", "cmake", "curl"]

[source]
urls = [
    { url = "https://static.rust-lang.org/dist/rustc-1.100.0-src.tar.xz" , sha256 = "90dab90b8084eb57c35ae2b1d0b70c8e5138ace6023b22c60a5a400f586f63b2"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD rust (build + package)",
    "# source top dir \"rustc-1.100.0-src\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "cat > config.toml <<EOF\n[build]\ndocs = false\nextended = true\ntools = [\"cargo\", \"rustfmt\", \"clippy\"]\npython = \"python3\"\n\n[install]\nprefix = \"/usr\"\n\n[llvm]\ndownload-ci-llvm = false\n\n[rust]\nchannel = \"stable\"\ncodegen-units = 1\ndebuginfo-level = 0\nEOF",
    "python3 x.py build --stage 2",
    "",
    "",
    "cd \".\"",
    "DESTDIR=\"$DESTDIR\" python3 x.py install --stage 2",
    "install -Dm644 LICENSE-MIT \"$DESTDIR/usr/share/licenses/rust/LICENSE-MIT\"",
    "install -Dm644 LICENSE-APACHE \"$DESTDIR/usr/share/licenses/rust/LICENSE-APACHE\"",
]

[install]
post = []
files = "auto"
backup = []
