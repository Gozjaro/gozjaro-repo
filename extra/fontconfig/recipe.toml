[package]
name = "fontconfig"
version = "2.16.0"
release = 1
desc = "A library for configuring and customizing font access"
license = "MIT"
depends = ["freetype2", "expat"]
build_depends = ["meson", "ninja", "freetype2"]

[source]
urls = [
    { url = "https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.16.0.tar.xz" , sha256 = "6a33dc555cc9ba8b10caf7695878ef134eeb36d0af366041f639b1da9b6ed220"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD fontconfig (build + package)",
    "# source top dir \"fontconfig-2.16.0\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--localstatedir=/var \\",
    "--buildtype=release \\",
    "-Ddoc=disabled \\",
    "-Dtests=disabled \\",
    "-Dtools=enabled",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
