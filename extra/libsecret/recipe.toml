[package]
name = "libsecret"
version = "0.20.5"
release = 1
desc = "Library for storing user secrets"
license = "LGPL-2.1-or-later"
depends = ["glib2"]
build_depends = ["meson", "ninja", "gobject-introspection"]

[source]
urls = [
    { url = "https://download.gnome.org/sources/libsecret/0.20/libsecret-0.20.5.tar.xz" , sha256 = "3fb3ce340fcd7db54d87c893e69bfc2b1f6e4d4b279065ffe66dac9f0fd12b4d"},
]
patches = []

[build]
system = "raw"
steps = [
    "meson setup \\",
    "build . \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--buildtype=release \\",
    "-Dmanpage=false",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
