[package]
name = "xmlto"
version = "0.0.29"
release = 1
desc = "XML-to-anything converter (front-end for DocBook/DTD-based XML conversion)"
license = "GPL-2.0-or-later"
depends = ["glibc"]
build_depends = ["autoconf", "automake"]

[source]
urls = [
    { url = "https://deb.debian.org/debian/pool/main/x/xmlto/xmlto_0.0.29.orig.tar.bz2", sha256 = "6000d8e8f0f9040426c4f85d7ad86789bc88d4aeaef585c4d4110adb0b214f21" },
]
# upstream git (pagure) is dumb-http only — the debian orig tarball is byte-source-identical
# to tag 0.0.29 and downloads as a plain HTTPS file, no git needed.
patches = []

[build]
system = "raw"
steps = [
    "# autotools, tarball source (top dir xmlto-0.0.29 stripped by the builder)",
    "",
    "autoreconf -fi",
    "./configure --prefix=/usr",
    "make",
    "",
    "",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 COPYING \"$DESTDIR/usr/share/licenses/xmlto/COPYING\"",
]

[install]
post = []
files = "auto"
backup = []
