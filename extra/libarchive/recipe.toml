[package]
name = "libarchive"
version = "3.8.8"
release = 1
desc = "Multi-format archive and compression library"
license = "BSD-2-Clause"
depends = ["zlib", "xz", "zstd", "bzip2", "openssl", "glibc"]
build_depends = ["cmake", "ninja"]

[source]
urls = [
    { url = "https://www.libarchive.org/downloads/libarchive-3.8.8.tar.xz", sha256 = "3873a88801da067d0528a989af06877710529d50ee8fe6f3970cbb4302efb918" },
]
patches = []

[build]
system = "raw"
steps = [
    "# cmake, source top dir libarchive-3.8.8 stripped by the builder — paths below are flat",
    "",
    "cmake_options=(",
    "-B build",
    "-G Ninja",
    "-D CMAKE_INSTALL_PREFIX=/usr",
    "-D CMAKE_BUILD_TYPE=None",
    "-D BUILD_SHARED_LIBS=ON",
    "-D ENABLE_OPENSSL=ON",
    "-D ENABLE_TEST=OFF",
    "-W no-dev",
    ")",
    "cmake \"${cmake_options[@]}\"",
    "cmake --build build --verbose",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
    "install -vDm 644 COPYING -t \"$DESTDIR/usr/share/licenses/libarchive/\"",
]

[install]
post = []
files = "auto"
backup = []
