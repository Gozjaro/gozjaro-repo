[package]
name = "linux-kernel"
version = "7.1.8"
release = 1
arch = "x86_64"
desc = "Pre-built GozJaro kernel 7.1.8: vmlinuz-7.1.8-gozjaro, /lib/modules/7.1.8 (11 ko + builtin lists), initramfs initrd-7.1.8-gozjaro.img, System.map + config. Packages the tree's stage 80/85 build artifacts so an installed system can switch kernel with 'gozpak get linux-kernel' instead of a source rebuild. Post-install runs the grub-mkconfig registry hook to regenerate the boot entry (skipped, non-fatal, if grub-mkconfig is absent)."
license = "GPL-2.0-or-later"
depends = []

[build]
system = "raw"
steps = [
"# package the tree's built kernel (stage 80/85 artifacts); dash test(1) has no -a, so separate lines",
"test -f /boot/vmlinuz-7.1.8-gozjaro",
"test -f /boot/initrd-7.1.8-gozjaro.img",
"test -d /lib/modules/7.1.8",
"mkdir -p $DESTDIR/boot $DESTDIR/lib/modules",
"cp /boot/vmlinuz-7.1.8-gozjaro /boot/System.map-7.1.8 /boot/config-7.1.8 /boot/initrd-7.1.8-gozjaro.img $DESTDIR/boot/",
"cp -a /lib/modules/7.1.8 $DESTDIR/lib/modules/",
"rm -f $DESTDIR/lib/modules/7.1.8/build",
]

[install]
post = ["grub-mkconfig"]
files = "auto"
backup = []
