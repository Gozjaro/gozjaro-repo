[package]
name = "linux-kernel"
version = "7.3.5"
release = 1
arch = "x86_64"
desc = "Pre-built GozJaro kernel 7.3.5: vmlinuz-7.3.5 + /lib/modules/7.3.5 + System.map + config, built from the linux 7.3.5-2 source package. Lets an installed system switch kernels with 'gozpak get linux-kernel' (binary install, no toolchain needed). Post-install runs the grub-mkconfig registry hook to regenerate the boot entry (skipped, non-fatal, if grub-mkconfig is absent). Regenerate the initramfs separately (gozjaro-build-initramfs from gozjaro-installer, or the live-ISO chain's stage 85)."
license = "GPL-2.0-or-later"
depends = ["linux"]

[build]
system = "raw"
steps = [
"# package the tree's built kernel (linux .gpkg build output in the chroot); dash test(1) has no -a, so separate lines",
"test -f /boot/vmlinuz-7.3.5",
"test -d /lib/modules/7.3.5",
"mkdir -p $DESTDIR/boot $DESTDIR/lib/modules",
"cp /boot/vmlinuz-7.3.5 /boot/System.map-7.3.5 /boot/config-7.3.5 $DESTDIR/boot/",
"cp -a /lib/modules/7.3.5 $DESTDIR/lib/modules/",
"rm -f $DESTDIR/lib/modules/7.3.5/build",
]

[install]
post = ["grub-mkconfig"]
files = "auto"
backup = []
