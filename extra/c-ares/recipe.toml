[package]
name = "c-ares"
version = "1.34.9"
release = 1
desc = "A C library for asynchronous DNS requests"
license = "MIT"
depends = ["glibc"]
build_depends = ["cmake", "git"]

[source]
git = "git+https://github.com/c-ares/c-ares.git#v1.34.9"
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD c-ares (build + package)",
    "",
    "cmake_options=(",
    "-B build",
    "-D CMAKE_INSTALL_PREFIX=/usr",
    "-D CMAKE_BUILD_TYPE=None",
    "-S .",
    "-W no-dev",
    ")",
    "cmake \"${cmake_options[@]}\"",
    "cmake --build build --verbose",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
    "install -vDm 644 LICENSE.md -t \"$DESTDIR/usr/share/licenses/c-ares/\"",
    "install -vDm 644 {AUTHORS,{CONTRIBUTING,README,RELEASE-NOTES}.md} -t \"$DESTDIR/usr/share/doc/c-ares/\"",
]

[install]
post = []
files = "auto"
backup = []
