[package]
name = "xdg-utils"
version = "1.2.1"
release = 1
desc = "Command line tools that assist applications with desktop integration"
license = "MIT"
depends = []
build_depends = ["xmlto", "docbook-xsl"]

[source]
git = "git+https://gitlab.freedesktop.org/xdg/xdg-utils.git#356c380ad6fecc9ce6bea1f6a77986ba67402c80"
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD xdg-utils (build + package)",
    "",
    "# LFS xmllint --postvalid ignores XML catalogs offline, so xmlto validation of the",
    "# shipped docbook sources dies on the 4.1.2 DTD; xmlto's own error message points at",
    "# --skip-validation. AC_PATH_PROG only honors a PRE-SET env var (a command-line",
    "# XMLTO=... assignment does not survive it), so export it into the environment first.",
    "XMLTO=\"xmlto --skip-validation\"",
    "export XMLTO",
    "./configure --prefix=/usr",
    "make",
    "",
    "",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 LICENSE \"$DESTDIR/usr/share/licenses/xdg-utils/LICENSE\"",
]

[install]
post = []
files = "auto"
backup = []
