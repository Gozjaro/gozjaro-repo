[package]
name = "xdg-utils"
version = "1.2.1"
release = 1
desc = "Command line tools that assist applications with desktop integration"
license = "MIT"
depends = []
build_depends = ["xmlto", "docbook-xsl"]

[source]
git = "git+https://gitlab.freedesktop.org/xdg/xdg-utils.git#356c380ad6fecc9ce6bea1f6a77986ba67402c80"
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD xdg-utils (build + package)",
    "",
    "# LFS xmllint --postvalid does not resolve the doctype DTD from the XML catalog",
    "# (verified: XML_CATALOGS set, validation still fails; plain --noout works), so",
    "# skip validation — the xml sources are upstream-released; the XSL transform still",
    "# resolves docbook.xsl through the catalog that xmlto now exports by default.",
    "XMLTO=\"/usr/bin/xmlto --skip-validation\"",
    "export XMLTO",
    "./configure --prefix=/usr",
    "make",
    "",
    "",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 LICENSE \"$DESTDIR/usr/share/licenses/xdg-utils/LICENSE\"",
]

[install]
post = []
files = "auto"
backup = []
