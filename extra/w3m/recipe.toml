[package]
name = "w3m"
version = "0.5.3"
release = 1
desc = "Text-based web browser (used by xmlto for the HTML-to-text conversion)"
license = "BSD-4-Clause"
depends = ["glibc", "ncurses", "zlib"]
build_depends = ["autoconf", "automake", "libgc"]

[source]
# upstream SourceForge 0.5.3 download is dead (404); the debian snapshot of
# the orig tarball is the byte-identical upstream source.
urls = [
    { url = "https://snapshot.debian.org/archive/debian/20240101T000000Z/pool/main/w/w3m/w3m_0.5.3.orig.tar.gz", sha256 = "e994d263f2fd2c22febfbe45103526e00145a7674a0fda79c822b97c2770a9e3" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD w3m (build + package)",
    "# plain-text http browser: no ssl (offline tree), no image handlers.",
    "# the release tarball ships a pre-generated configure; do NOT run autoreconf",
    "# (it regenerates aclocal.m4 and loses the gettext macros w3m's",
    "# configure.ac uses, e.g. AM_LANGINFO_CODESET).",
    "# w3m 0.5.3 is K&R-era: empty-paren declarations (getenv(), push_to()...) are",
    "# illegal under the default C11; build with -std=gnu89 where they are legal.",
    "",
    "export CFLAGS=\"-std=gnu89 -O2 -pipe\"",
    "./configure --prefix=/usr",
    "make",
    "",
    "",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 COPYING \"$DESTDIR/usr/share/licenses/w3m/COPYING\"",
]

[install]
post = []
files = "auto"
backup = []
