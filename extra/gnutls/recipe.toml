[package]
name = "gnutls"
version = "3.8.13"
release = 1
desc = "A library which provides a secure layer over a reliable transport layer"
license = "GPL-3.0-or-later"
depends = ["nettle", "libtasn1", "p11-kit", "zlib"]
build_depends = []

[source]
# ftp.gnupg.org no longer hosts release tarballs — use the upstream tag via git.
# 3.8.13 (latest) builds against nettle 4.x; 3.8.8 predated the nettle/sha.h
# consolidation and breaks on our wide-only, nettle-4 tree.
git = "git+https://github.com/gnutls/gnutls.git#3.8.13"
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD gnutls (build + package)",
    "# git source: checkout root is the source root (flat, no top dir)",
    "",
    "cd \".\"",
    "./configure \\",
    "--prefix=/usr \\",
    "--disable-static \\",
    "--disable-guile \\",
    "--disable-doc \\",
    "--disable-tests \\",
    "--with-included-unistring \\",
    "--without-idn",
    "make",
    "",
    "",
    "cd \".\"",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
