[package]
name = "busybox"
version = "1.37.0"
release = 1
desc = "Size-optimized toolbox of Unix utilities (binary only; applets via 'busybox <cmd>')"
license = "GPL-2.0-only"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://busybox.net/downloads/busybox-1.37.0.tar.bz2" , sha256 = "3311dff32e746499f4df0d5df04d7eb396382d7e108bb9250e7b519b837043a4"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD busybox (build + package)",
    "# source top dir \"busybox-1.37.0\" is stripped by the builder — paths below are flat",
    "",
    "cd \".\"",
    "make defconfig",
    "sed -i 's/CONFIG_FEATURE_SYSTEMD=y/# CONFIG_FEATURE_SYSTEMD is not set/' .config || true",
    "sed -i 's/CONFIG_TC=y/# CONFIG_TC is not set/' .config || true",
    "make",
    "",
    "",
    "cd \".\"",
    # Applet symlinks (make CONFIG_PREFIX=... install) must NOT be shipped:
    # the chroot build layer stacks this package under the LFS root, where
    # /usr/bin/{patch,diff,sed,awk,tar,...} symlinks would shadow the GNU
    # tools — busybox's patch applet silently drops multi-hunk patches.
    # Ship the binary only; applets stay reachable via `busybox <cmd>`.
    "install -Dm755 busybox \"$DESTDIR/usr/bin/busybox\"",
]

[install]
post = []
files = "auto"
backup = []
