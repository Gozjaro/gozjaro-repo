[package]
name = "pam"
version = "1.7.3"
release = 1
desc = "Pluggable Authentication Modules"
license = "GPL-3.0-or-later"
depends = []
build_depends = []

[source]
urls = [
    { url = "https://github.com/linux-pam/linux-pam/archive/refs/tags/v1.7.3.tar.gz" , sha256 = "29c2a93f819a62ba981f695b03fe00550b49ce7ae5c5342edaaf860687fbb1a0"},
]
patches = []

[build]
system = "raw"
steps = [
    "# linux-pam v1.7.3 (github tag tarball), autotools build",
    "./configure \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--docdir=/usr/share/doc/pam-1.7.3 \\",
    "--with-security-dir=/etc/security \\",
    "make",
    "",
    "",
    "make DESTDIR=\"$DESTDIR\" install",
]

[install]
post = []
files = "auto"
backup = []
