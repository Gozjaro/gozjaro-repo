[package]
name = "docbook-xsl"
version = "1.79.1"
release = 1
desc = "DocBook XSL stylesheets"
license = "Custom"
depends = []
build_depends = ["libxml2"]

[source]
urls = [
    { url = "https://downloads.sourceforge.net/project/docbook/xsl/1.79.1/docbook-xsl-1.79.1.tar.bz2", sha256 = "725f452e12b296956e8bfb876ccece71eeecdd14b94f667f3ed9091761a4a968" },
]
patches = []

[build]
system = "raw"
steps = [
    "# data package: install XSL runtime tree + register catalog redirect",
    "cd \".\"",
    "install -d -m755 \"$DESTDIR/usr/share/xml/docbook/xsl/current\"",
    "for d in assembly common epub epub3 fo html htmlhelp javahelp lib manpages params slides template webhelp website xhtml xhtml5; do cp -a \"$d\" \"$DESTDIR/usr/share/xml/docbook/xsl/current/\"; done",
    "cp -a catalog.xml VERSION.xsl \"$DESTDIR/usr/share/xml/docbook/xsl/current/\"",
    "install -d -m755 \"$DESTDIR/etc/xml\"",
        "cat > \"$DESTDIR/etc/xml/catalog\" <<'EOF'",
    "<?xml version=\"1.0\"?>",
    "<!DOCTYPE catalog PUBLIC \"-//OASIS//DTD Entity Resolution XML Catalog V1.0//EN\" \"http://www.oasis-open.org/committees/entity/release/1.0/catalog.dtd\">",
    "<catalog xmlns=\"urn:oasis:names:tc:entity:xmlns:xml:catalog\">",
    "  <public publicId=\"-//OASIS//DTD DocBook XML V4.3//EN\" uri=\"file:///usr/share/xml/docbook/dtd/xml/4.3/docbookx.dtd\"/>",
    "  <rewriteURI uriStartString=\"http://docbook.sourceforge.net/release/xsl/current/\" rewritePrefix=\"file:///usr/share/xml/docbook/xsl/current/\"/>",
    "</catalog>",
    "EOF",
]

[install]
post = []
files = "auto"
backup = []
