[package]
name = "fastfetch"
version = "2.71.0"
release = 6
desc = "A fast system info tool written in C"
license = "MIT"
depends = []
build_depends = ["cmake", "ninja"]

[source]
urls = [
    { url = "https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/2.71.0.tar.gz", sha256 = "e71d93de41e8e4b2554c36d2ae51758112a21ecf3a8c98605a2c689251e62987"},
]
patches = []

[build]
system = "raw"
steps = [
"# converted from gozjaro-pkgs PKGBUILD fastfetch; 2.71.0 flat top dir stripped by the builder",
"cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_SYSTEM_YYJSON=OFF -GNinja",
"cmake --build build",
"",
"DESTDIR=\"$DESTDIR\" cmake --install build",
"install -Dm644 \"LICENSE\" \"$DESTDIR/usr/share/licenses/fastfetch/LICENSE\"",
"",
"# GozJaro branding: ship the ASCII logo + system-wide fastfetch defaults",
"install -d -m755 \"$DESTDIR/usr/share/fastfetch/logos\"",
"# logo asset (ANSI escapes kept verbatim; fastfetch prints them as-is)",
"install -m644 \"$RECIPE_DIR/assets/gozjaro-logo.txt\" \"$DESTDIR/usr/share/fastfetch/logos/gozjaro.txt\"",
"# system config: 2.x JSON-config semantics \u2014 a config file REPLACES the default module list,",
"# so ship the default modules (29, from 2.71.0 --gen-config) + the dog logo (full path: the",
"# system logo dir is NOT in the runtime name-lookup path) + colors. /etc/xdg is scanned",
"# (XDG_CONFIG_DIRS default) before user config; CLI flags still override.",
"install -d -m755 \"$DESTDIR/etc/xdg/fastfetch\"",
"cat > \"$DESTDIR/etc/xdg/fastfetch/config.jsonc\" <<'EOF'",
"// GozJaro fastfetch system defaults (branding: dog logo + default module set)",
"{",
"  \"$schema\": \"https://github.com/fastfetch-cli/fastfetch/raw/master/doc/json_schema.json\",",
"  \"modules\": [\"title\", \"separator\", \"os\", \"host\", \"kernel\", \"uptime\", \"packages\", \"shell\", \"display\", \"de\", \"wm\", \"wmtheme\", \"theme\", \"icons\", \"font\", \"cursor\", \"terminal\", \"terminalfont\", \"cpu\", \"gpu\", \"memory\", \"swap\", \"disk\", \"localip\", \"battery\", \"poweradapter\", \"locale\", \"break\", \"colors\"],",
"  \"logo\": {",
"    \"source\": \"/usr/share/fastfetch/logos/gozjaro.txt\",",
"    \"color\": { \"1\": \"magenta\", \"2\": \"blue\", \"3\": \"default\" }",
"  }",
"}",
"EOF"
]

[install]
post = []
files = "auto"
backup = []
