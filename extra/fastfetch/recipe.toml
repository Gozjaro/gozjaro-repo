[package]
name = "fastfetch"
version = "v1.0.1"
release = 2
desc = "A fast system info tool written in C"
license = "MIT"
depends = []
build_depends = ["cmake", "ninja"]

[source]
urls = [
    { url = "https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/v1.0.1.tar.gz", sha256 = "ca8052de2a8c1fa43f7e55bb2703e48e4880debcd88f0b23e080535e22ae319f"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD fastfetch (build + package)",
    "# tarball source: top dir fastfetch-1.0.1 stripped by the builder — paths below are flat",
    "",
    "cmake -B build -S . \\",
    "-DCMAKE_BUILD_TYPE=Release \\",
    "-DCMAKE_INSTALL_PREFIX=/usr \\",
    "-DENABLE_SYSTEM_YYJSON=OFF \\",
    "-GNinja",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\\\"$DESTDIR\\\" cmake --install build",
    "install -Dm644 \\\"LICENSE\\\" \\\"$DESTDIR/usr/share/licenses/fastfetch/LICENSE\\\"",
    "",
    "# GozJaro branding: ship the ASCII dog logo + system-wide fastfetch defaults",
    "# logo file (fastfetch $1/$2/$3 color placeholders: ## magenta, %% blue)",
    "install -d -m755 \\\"$DESTDIR/usr/share/fastfetch/logos\\\"",
    "cat > \\\"$DESTDIR/usr/share/fastfetch/logos/gozjaro.txt\\\" <<'EOF'",
    " /\\              /\\",
    "/$1##$3\\            /$2%%$3\\",
    "|$1###$3\\          /$2%%%$3|",
    "|$1####$3\\________/$2%%%%$3|",
    "|        $1<>$3        |",
    "|                  |",
    "|   \\_\\      /_/   |",
    " \\                /",
    "  \\              /",
    "   \\            /",
    "    \\    <>    /",
    "     \\        /",
    "      \\______/",
    "EOF",
    "# system config: plain `fastfetch` shows the GozJaro dog by default",
    "# (users can override via ~/.config/fastfetch/config.conf or CLI flags)",
    "install -d -m755 \\\"$DESTDIR/etc/fastfetch\\\"",
    "cat > \\\"$DESTDIR/etc/fastfetch/config.conf\\\" <<'EOF'",
    "# GozJaro fastfetch system defaults (branding)",
    "--logo /usr/share/fastfetch/logos/gozjaro.txt",
    "--logo-color-1 magenta",
    "--logo-color-2 blue",
    "EOF",
]

[install]
post = []
files = "auto"
backup = []
