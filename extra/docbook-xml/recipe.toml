[package]
name = "docbook-xml"
version = "4.5"
release = 1
desc = "DocBook XML DTDs (4.0-4.5)"
license = "Custom"
depends = []
build_depends = ["libxml2"]

[source]
urls = [
    { url = "https://deb.debian.org/debian/pool/main/d/docbook-xml/docbook-xml_4.5.orig.tar.gz", sha256 = "b0f8edcf697f5318e63dd98c9a931f3fee167af0805ba441db372e0f17b2a44f" },
]
# debian pool orig tarball (docbook.org stopped serving zips); DTDs 4.0-4.5
patches = []

[build]
system = "raw"
steps = [
    "# data package: install DTDs + register catalog",
    "cd \".\"",
    "for v in docbook-4.0 docbook-4.1.2 docbook-4.2 docbook-4.3 docbook-4.4 docbook-4.5; do",
    "    install -d -m755 \"$DESTDIR/usr/share/xml/docbook/dtd/xml/${v#docbook-}\"",
    "    cp -a \"$v\" \"$DESTDIR/usr/share/xml/docbook/dtd/xml/${v#docbook-}\"",
    "done",
    "install -d -m755 \"$DESTDIR/etc/xml\"",
    "cat > \"$DESTDIR/etc/xml/catalog\" <<'EOF'",
    "<?xml version=\"1.0\"?>",
    "<!DOCTYPE catalog PUBLIC \"-//OASIS//DTD Catalog V1.0//EN\" \"http://www.oasis-open.org/committees/entity/release/1.0/catalog.dtd\">",
    "<catalog xmlns=\"http://www.w3.org/2005/xmlcatalog\">",
    "  <public id=\"-//OASIS//DTD DocBook XML V4.3//EN\" uri=\"file:///usr/share/xml/docbook/dtd/xml/4.3/docbookx.dtd\"/>",
    "  <rebind uriName=\"http://docbook.sourceforge.net/release/xsl/current\" uri=\"file:///usr/share/xml/docbook/xsl/current\"/>",
    "  <rebind uriName=\"http://docbook.sourceforge.net/release/xsl/current/\" uri=\"file:///usr/share/xml/docbook/xsl/current/\"/>",
    "</catalog>",
    "EOF",
]

[install]
post = []
files = "auto"
backup = []
