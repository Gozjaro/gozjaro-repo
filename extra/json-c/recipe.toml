[package]
name = "json-c"
version = "0.19"
release = 1
desc = "JSON implementation in C"
license = "MIT"
depends = ["glibc"]
build_depends = ["cmake", "git", "ninja"]

[source]
git = "git+https://github.com/json-c/json-c#json-c-0.19-20260627"
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD json-c (build + package)",
    "",
    "cmake_options=(",
    "-D BUILD_STATIC_LIBS=OFF",
    "-D CMAKE_BUILD_TYPE=None",
    "-D CMAKE_INSTALL_LIBDIR=/usr/lib",
    "-D CMAKE_INSTALL_PREFIX=/usr",
    "-D CMAKE_POLICY_VERSION_MINIMUM=3.5",
    "-D ENABLE_RDRAND=OFF",
    "-D ENABLE_THREADING=ON",
    ")",
    "",
    "cmake -S . -B build -G Ninja \"${cmake_options[@]}\"",
    "cmake --build build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" cmake --install build",
    "install -Dt \"$DESTDIR/usr/share/licenses/json-c\" -m644 COPYING",
]

[install]
post = []
files = "auto"
backup = []
