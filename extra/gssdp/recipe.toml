[package]
name = "gssdp"
version = "1.4.0.1"
release = 1
desc = "GNOME SSDP client server"
license = "LGPL-2.1-or-later"
depends = ["glib2"]
build_depends = ["meson", "ninja", "gobject-introspection"]

[source]
urls = [
    { url = "https://download.gnome.org/sources/gssdp/1.4/gssdp-1.4.0.1.tar.xz" , sha256 = "8676849d57fb822b8728856dbadebf3867f89ee47a0ec47a20045d011f431582"},
]
patches = []

[build]
system = "raw"
steps = [
    "meson setup \\",
    "build . \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--buildtype=release \\",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
