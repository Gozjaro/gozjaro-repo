[package]
name = "libuv"
version = "1.53.0"
release = 1
desc = "Multi-platform support library with focus on asynchronous I/O (event loop)"
license = "MIT"
depends = ["glibc", "openssl"]
build_depends = []

[source]
urls = [
    { url = "https://codeload.github.com/libuv/libuv/tar.gz/refs/tags/v1.53.0", sha256 = "279f3f67a24bb9921fe999ca6cd5e332fade8d515873ef9ba054b70e70a31d9e" },
]
patches = []

[build]
system = "raw"
steps = [
    "# autotools, source top dir libuv-1.53.0 stripped by the builder — paths below are flat",
    "",
    "./configure --prefix=/usr --with-openssl --enable-shared --disable-static",
    "make",
    "",
    "",
    "make DESTDIR=\"$DESTDIR\" install",
    "install -Dm644 LICENSE \\\"$DESTDIR/usr/share/licenses/libuv/LICENSE\\\"",
]

[install]
post = []
files = "auto"
backup = []
