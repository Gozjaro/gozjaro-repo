[package]
name = "glib2"
version = "2.82.5"
release = 1
desc = "Low level core library"
license = "LGPL-2.1-or-later"
depends = ["pcre2", "libffi", "zlib"]
build_depends = ["meson", "ninja", "pcre2", "libffi", "python3", "gobject-introspection", "libxml2"]

[source]
urls = [
    { url = "https://download.gnome.org/sources/glib/2.82/glib-2.82.5.tar.xz" , sha256 = "05c2031f9bdf6b5aba7a06ca84f0b4aced28b19bf1b50c6ab25cc675277cbc3f"},
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from gozjaro-pkgs PKGBUILD glib2 (build + package)",
    "# source top dir \"glib-2.82.5\" is stripped by the builder — paths below are flat",
    "",
    "meson setup \".\" build \\",
    "--prefix=/usr \\",
    "--sysconfdir=/etc \\",
    "--buildtype=release \\",
    "-Dglib_debug=disabled \\",
    "-Dtests=false \\",
    "-Dintrospection=enabled \\",
    "-Ddtrace=false \\",
    "-Dsysprof=disabled \\",
    "-Ddocumentation=false \\",
    "-Dman-pages=disabled \\",
    "-Dselinux=disabled",
    "ninja -C build",
    "",
    "",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
    "install -Dm644 COPYING \"$DESTDIR/usr/share/licenses/glib2/COPYING\"",
]

[install]
post = []
files = "auto"
backup = []
