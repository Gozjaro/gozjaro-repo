[package]
name = "tllist"
version = "1.1.0"
release = 1
desc = "Header-only intrusive linked list library (dependency of fcft/foot)"
license = "MIT"
depends = []
build_depends = ["meson", "ninja"]

[source]
urls = [
    { url = "https://codeberg.org/dnkl/tllist/releases/download/1.1.0/tllist-1.1.0.tar.gz", sha256 = "a1f0ce0dc4fcb4ce59c37202a1d914c853a8bd2d7c5d57d623b15a8dd9778767" },
]
patches = []

[build]
system = "raw"
steps = [
    "# converted from PKGBUILD in the release tarball (arch: tllist)",
    "meson setup --prefix=/usr --buildtype=release build",
    "ninja -C build",
    "DESTDIR=\"$DESTDIR\" ninja -C build install",
]

[install]
post = []
files = "auto"
backup = []
